name: Surveillance XAUUSD

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xauusd-surveillance
  cancel-in-progress: false

jobs:
  check-signals:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la vérification des signaux
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python -u xauusd_github_actions.py

      - name: Sauvegarder l'état (state.json) dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Mise à jour de l'état du signal"

          # Si le push est rejeté (un autre run, ou un push manuel, a modifié
          # le dépôt entre-temps), on récupère les derniers changements et on
          # réessaie, plutôt que de planter le job.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push réussi (tentative $i)."
              break
            fi
            echo "Push rejeté (tentative $i/5), récupération des derniers changements..."
            git pull --rebase --autostash
            sleep $((RANDOM % 5 + 1))
          done