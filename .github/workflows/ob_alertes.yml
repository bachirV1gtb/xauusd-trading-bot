name: Alertes Order Blocks
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une image de test maintenant (1 = oui)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: ob-alertes
  cancel-in-progress: false
jobs:
  alertes:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy matplotlib requests yfinance
      - name: Identite git
        run: |
          git config user.name "ob-alertes-bot"
          git config user.email "ob-alertes-bot@users.noreply.github.com"
      - name: Surveillance en continu
        run: python -u ob_alertes.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHANNEL_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          MIN_STARS: "2"
          DUREE_MIN: "345"
          TEST_MODE: ${{ github.event.inputs.test == '1' && '1' || '0' }}
